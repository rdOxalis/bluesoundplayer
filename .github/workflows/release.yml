name: Release
on:
  push:
    tags:
      - 'v*'
env:
  flutter-version: '3.22.0'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
      - run: cd flutter && flutter build apk --release
