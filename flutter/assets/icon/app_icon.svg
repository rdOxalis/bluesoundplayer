<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <linearGradient id="speakerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E3F2FD"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)"/>

  <!-- Speaker body -->
  <path d="M140 180 L200 180 L280 110 L280 402 L200 332 L140 332 Z"
        fill="url(#speakerGrad)"
        stroke="none"/>

  <!-- Sound waves -->
  <path d="M320 180 Q380 256 320 332"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="24"
        stroke-linecap="round"
        opacity="0.9"/>

  <path d="M360 130 Q450 256 360 382"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="24"
        stroke-linecap="round"
        opacity="0.7"/>

  <path d="M400 80 Q520 256 400 432"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="24"
        stroke-linecap="round"
        opacity="0.5"/>
</svg>
